openapi: 3.0.3
info:
  title: io-dono Backend API
  description: >
    Specifica OpenAPI 3 completa delle API RESTful del backend io-dono.
    Include autenticazione locale/Google, gestione donazioni e segnalazioni.
  version: 1.0.0
  contact:
    name: io-dono API Team
    email: support@io-dono.local
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Root
    description: Endpoint di servizio API
  - name: Auth
    description: Registrazione, login e sessioni
  - name: Donations
    description: Gestione donazioni
  - name: Reports
    description: Gestione segnalazioni

security:
  - bearerAuth: []

paths:
  /api:
    get:
      tags: [Root]
      summary: Root API
      description: Endpoint base per verifica raggiungibilità API.
      operationId: getApiRoot
      security: []
      responses:
        '200':
          description: API raggiungibile
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: api default

  /api/auth/users:
    post:
      tags: [Auth]
      summary: Registrazione utente locale
      description: >
        Crea un nuovo utente locale con ruolo applicativo.
        Se l'email è già presente il sistema risponde con errore 400.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            examples:
              validDonor:
                $ref: '#/components/examples/AuthRegisterRequestExample'
      responses:
        '201':
          description: Utente creato e token JWT emesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/sessions:
    post:
      tags: [Auth]
      summary: Login locale
      description: >
        Autentica un utente locale tramite email/password.
        Per account creati con Google OAuth il login locale è bloccato.
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login riuscito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenUserResponse'
              examples:
                success:
                  $ref: '#/components/examples/AuthLoginResponseExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/sessions/me:
    get:
      tags: [Auth]
      summary: Utente autenticato corrente
      operationId: getCurrentSession
      responses:
        '200':
          description: Sessione valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/google/authorize:
    get:
      tags: [Auth]
      summary: Avvio OAuth Google
      operationId: startGoogleOAuth
      security: []
      responses:
        '302':
          description: Redirect verso consenso Google

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth Google
      operationId: googleOAuthCallback
      security: []
      responses:
        '200':
          description: Utente Google già registrato (login token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleExchangeLoginResponse'
        '201':
          description: Utente Google non registrato (registration token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleExchangeRegistrationResponse'
        '302':
          description: Redirect di failure verso /login
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/google/sessions:
    post:
      tags: [Auth]
      summary: Exchange token Google
      description: >
        Scambia il token Google (`token`) con:
        - `loginToken` se l'utente esiste
        - `registrationToken` se deve completare la registrazione
      operationId: exchangeGoogleToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleTokenExchangeRequest'
      responses:
        '200':
          description: Login token emesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleExchangeLoginResponse'
        '201':
          description: Registration token emesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleExchangeRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/google/users:
    post:
      tags: [Auth]
      summary: Completa registrazione utente Google
      description: >
        Richiede Authorization Bearer con registration token (type=registration),
        non un login JWT standard.
      operationId: registerGoogleUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleRegisterRequest'
      responses:
        '201':
          description: Utente Google creato e token login emesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/donations:
    post:
      tags: [Donations]
      summary: Crea donazione
      description: >
        Crea una donazione (solo ruolo DONOR).
        Richiede almeno un item, pickupTime nel futuro e pickupLocation completa.
      operationId: createDonation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonationRequest'
            examples:
              validDonation:
                $ref: '#/components/examples/CreateDonationRequestExample'
      responses:
        '201':
          description: Donazione creata
          headers:
            Location:
              description: URI della risorsa creata
              schema:
                type: string
                example: /api/donations/65f3c2b9f4bbf8a7d3ea0011
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Donations]
      summary: Lista donazioni
      description: >
        Filtri e visibilità dipendono dal ruolo:
        DONOR vede solo proprie; ASSOCIATION vede AVAILABLE e proprie ACCEPTED/COMPLETED;
        ADMIN vede completo con filtri avanzati.
      operationId: listDonations
      parameters:
        - $ref: '#/components/parameters/DonationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/DonorId'
        - $ref: '#/components/parameters/AssociationId'
      responses:
        '200':
          description: Lista donazioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/donations/{id}:
    parameters:
      - $ref: '#/components/parameters/DonationId'
    get:
      tags: [Donations]
      summary: Dettaglio donazione
      operationId: getDonationById
      responses:
        '200':
          description: Donazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Donations]
      summary: Aggiorna parzialmente donazione
      description: >
        - DONOR proprietario: aggiorna campi solo se status AVAILABLE
        - ASSOCIATION: transizioni stato (ACCEPTED, COMPLETED con evaluation.rating)
      operationId: patchDonation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDonationRequest'
            examples:
              completeDonation:
                $ref: '#/components/examples/PatchDonationCompletedExample'
      responses:
        '200':
          description: Donazione aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Donations]
      summary: Elimina donazione
      description: Solo DONOR proprietario e solo in stato AVAILABLE.
      operationId: deleteDonation
      responses:
        '204':
          description: Donazione eliminata
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/reports:
    post:
      tags: [Reports]
      summary: Crea segnalazione
      description: >
        Crea una segnalazione su un utente o su una donazione.
        È obbligatorio valorizzare almeno uno tra reportedUserId e donationId.
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
            examples:
              userBehavior:
                $ref: '#/components/examples/CreateReportRequestExample'
      responses:
        '201':
          description: Segnalazione creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Reports]
      summary: Lista segnalazioni
      description: >
        Filtri: status, type, scope.
        `scope=all` è effettivo solo per ADMIN.
      operationId: listReports
      parameters:
        - $ref: '#/components/parameters/ReportStatus'
        - $ref: '#/components/parameters/ReportType'
        - $ref: '#/components/parameters/ReportScope'
      responses:
        '200':
          description: Lista segnalazioni
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/reports/{id}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      summary: Dettaglio segnalazione
      operationId: getReportById
      responses:
        '200':
          description: Segnalazione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Reports]
      summary: Aggiorna segnalazione (solo ADMIN)
      operationId: patchReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchReportRequest'
      responses:
        '200':
          description: Segnalazione aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DonationId:
      name: id
      in: path
      required: true
      description: ID MongoDB della donazione
      schema:
        $ref: '#/components/schemas/ObjectId'
    ReportId:
      name: id
      in: path
      required: true
      description: ID MongoDB della segnalazione
      schema:
        $ref: '#/components/schemas/ObjectId'
    DonationStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [AVAILABLE, ACCEPTED, COMPLETED, CANCELLED]
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    Owner:
      name: owner
      in: query
      required: false
      schema:
        type: string
        enum: [me]
    DonorId:
      name: donorId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ObjectId'
    AssociationId:
      name: associationId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ObjectId'
    ReportStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [OPEN, CLOSED]
    ReportType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [MALFUNCTION, USER_BEHAVIOR]
    ReportScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [me, all]
        default: me

  responses:
    BadRequest:
      description: Richiesta non valida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Non autenticato / token non valido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Accesso negato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflitto di stato della risorsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Errore interno server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 65f3c2b9f4bbf8a7d3ea0011

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Errore del server
        error:
          type: string
          nullable: true

    UserProfile:
      type: object
      properties:
        donorType:
          type: string
          enum: [PRIVATE, COMMERCIAL]
        commercialHours:
          type: string

    UserPublic:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
        googleId:
          type: string
          nullable: true
        role:
          type: string
          enum: [DONOR, ASSOCIATION, ADMIN]
        name:
          type: string
        phoneNumber:
          type: string
        address:
          type: string
        profile:
          $ref: '#/components/schemas/UserProfile'
        solidarityPoints:
          type: integer
          default: 0
        redeemedRewards:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthRegisterRequest:
      type: object
      required: [email, password, name, role, phoneNumber, address]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [DONOR, ASSOCIATION, ADMIN]
        phoneNumber:
          type: string
        address:
          type: string
        profile:
          $ref: '#/components/schemas/UserProfile'

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokenUserResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT login token
        user:
          $ref: '#/components/schemas/UserPublic'

    SessionMeResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
          example: Sei autenticato con successo!
        user:
          $ref: '#/components/schemas/UserPublic'

    GoogleTokenExchangeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Google ID token inviato dal frontend

    GoogleExchangeLoginResponse:
      type: object
      required: [loginToken, user]
      properties:
        loginToken:
          type: string
          description: JWT login token applicativo
        user:
          $ref: '#/components/schemas/UserPublic'

    GoogleExchangeRegistrationResponse:
      type: object
      required: [registrationToken]
      properties:
        registrationToken:
          type: string
          description: JWT temporaneo per completamento registrazione Google

    GoogleRegisterRequest:
      type: object
      required: [role, phoneNumber, address]
      properties:
        role:
          type: string
          enum: [DONOR, ASSOCIATION, ADMIN]
        phoneNumber:
          type: string
        address:
          type: string
        profile:
          $ref: '#/components/schemas/UserProfile'

    DonationItem:
      type: object
      required: [type, name, quantity]
      properties:
        type:
          type: string
          example: Cibo
        name:
          type: string
          example: Pasta
        quantity:
          type: string
          example: 5kg

    DonationGeo:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
          default: Point
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [11.12, 46.06]

    DonationPickupLocation:
      type: object
      required: [address, geo]
      properties:
        address:
          type: string
          example: Via Mesiano, Trento
        geo:
          $ref: '#/components/schemas/DonationGeo'

    DonationEvaluation:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10
        comment:
          type: string

    Donation:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        donorId:
          $ref: '#/components/schemas/ObjectId'
        associationId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        status:
          type: string
          enum: [AVAILABLE, ACCEPTED, COMPLETED, CANCELLED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/DonationItem'
        pickupTime:
          type: string
          format: date-time
        notes:
          type: string
        pickupLocation:
          $ref: '#/components/schemas/DonationPickupLocation'
        evaluation:
          $ref: '#/components/schemas/DonationEvaluation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDonationRequest:
      type: object
      required: [items, pickupTime, pickupLocation]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DonationItem'
        pickupTime:
          type: string
          format: date-time
        notes:
          type: string
        pickupLocation:
          $ref: '#/components/schemas/DonationPickupLocation'

    PatchDonationRequest:
      type: object
      description: >
        Payload multi-caso:
        - transizione ACCEPTED: {"status":"ACCEPTED"}
        - transizione COMPLETED: {"status":"COMPLETED","evaluation":{"rating":X}}
        - update donor: items/pickupTime/notes/pickupLocation
      properties:
        status:
          type: string
          enum: [ACCEPTED, COMPLETED]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DonationItem'
        pickupTime:
          type: string
          format: date-time
        notes:
          type: string
        pickupLocation:
          $ref: '#/components/schemas/DonationPickupLocation'
        evaluation:
          $ref: '#/components/schemas/DonationEvaluation'

    DonationListMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    DonationListLinks:
      type: object
      required: [self]
      properties:
        self:
          type: string
          example: /api/donations?page=1&limit=20

    DonationListResponse:
      type: object
      required: [items, meta, links]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Donation'
        meta:
          $ref: '#/components/schemas/DonationListMeta'
        links:
          $ref: '#/components/schemas/DonationListLinks'

    Report:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        reporterId:
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/UserPublic'
        reportedUserId:
          nullable: true
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/UserPublic'
        donationId:
          nullable: true
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/Donation'
        type:
          type: string
          enum: [MALFUNCTION, USER_BEHAVIOR]
        description:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateReportRequest:
      type: object
      required: [type, description]
      properties:
        reportedUserId:
          $ref: '#/components/schemas/ObjectId'
        donationId:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
          enum: [MALFUNCTION, USER_BEHAVIOR]
        description:
          type: string
          minLength: 5
      oneOf:
        - required: [reportedUserId]
        - required: [donationId]
      description: >
        Deve essere valorizzato almeno uno tra reportedUserId e donationId.

    PatchReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED]

    ReportCreateResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          required: [report]
          properties:
            report:
              $ref: '#/components/schemas/Report'

    ReportGetResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          required: [report]
          properties:
            report:
              $ref: '#/components/schemas/Report'

    ReportListResponse:
      type: object
      required: [status, results, data]
      properties:
        status:
          type: string
          example: success
        results:
          type: integer
          example: 2
        data:
          type: object
          required: [reports]
          properties:
            reports:
              type: array
              items:
                $ref: '#/components/schemas/Report'

